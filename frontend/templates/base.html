<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PgGuardian{% endblock %}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-magenta: #d946ef;
            --dark-deep: #050505;
            --glass: rgba(255, 255, 255, 0.03);
        }
        body {
            background-color: var(--dark-deep);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(217, 70, 239, 0.12) 0%, transparent 70%),
                url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            min-height: 100vh;
        }
        .tech-font { font-family: 'Syncopate', sans-serif; letter-spacing: 2px; }
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(217, 70, 239, 0.15);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }
        .nav-link {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }
        .nav-link:hover { color: var(--neon-magenta); text-shadow: 0 0 10px var(--neon-magenta); }
        .active-link { color: var(--neon-magenta); border-bottom: 2px solid var(--neon-magenta); }
        .status-pulse {
            width: 10px; height: 10px;
            background: var(--neon-magenta);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-magenta);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.5; }
            100% { transform: scale(0.9); opacity: 1; }
        }
    </style>
</head>
<body class="flex flex-col">

    <nav class="flex justify-between items-center p-8 border-b border-white/5 bg-black/40 sticky top-0 z-50 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="status-pulse"></div>
            <span class="tech-font font-bold text-xl tracking-widest">PG_GUARDIAN</span>
        </div>
        <div class="flex gap-10">
            <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active-link{% endif %}">Dashboard</a>
            <a href="/report" class="nav-link {% if request.path == '/report' %}active-link{% endif %}">Reportes</a>
            <a href="/compare" class="nav-link {% if request.path == '/compare' %}active-link{% endif %}">Historial</a>
        </div>
    </nav>

    <main class="flex-grow container mx-auto p-12">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
