{% extends "base.html" %}

{% block content %}

<!-- Contenedor principal centrado verticalmente -->
<div class="min-h-[75vh] flex flex-col justify-center">

    <!-- Header -->
    <div class="text-center mb-24">

        <p class="text-[10px] uppercase tracking-[0.5em] text-magenta-400 mb-3">
            Database Integrity System
        </p>

        <h1 class="tech-font text-6xl md:text-7xl font-bold mb-6">
            STATUS
        </h1>

        <div class="w-40 h-1 bg-magenta-500 mx-auto rounded-full shadow-[0_0_15px_#d946ef]"></div>

    </div>
    <div class="text-center mb-12"> <div class="flex justify-center mt-8">
        <button onclick="ejecutarAuditoria()" id="btn-audit" 
                class="glass-card px-8 py-4 border-magenta-500/50 hover:bg-magenta-500/20 transition-all flex items-center gap-4 group">
            <div id="spinner" class="hidden animate-spin w-5 h-5 border-2 border-magenta-500 border-t-transparent rounded-full"></div>
            <span id="btn-text" class="tech-font text-sm tracking-[0.3em] uppercase text-white group-hover:text-magenta-400">
                Escanear Base de Datos
            </span>
        </button>
    </div>
</div>

<div class="grid grid-cols-1 md:grid-cols-4 gap-6">
    </div>

    <!-- Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">

        <!-- Card 1 -->
        <div class="glass-card p-8 text-center">
            <p class="text-[9px] uppercase text-slate-500 mb-3 tracking-widest">
                Hallazgos Totales
            </p>

            <h3 class="text-5xl font-bold text-white">
                {{ total_findings }}
            </h3>
        </div>

        <!-- Card 2 -->
        <div class="glass-card p-8 text-center border-magenta-500/20">
            <p class="text-[9px] uppercase text-slate-500 mb-3 tracking-widest">
                Salud Global
            </p>

            <h3 class="text-5xl font-bold text-magenta-400">
                {{ health_score }}%
            </h3>
        </div>

   

        <!-- Card 3 -->
        <div class="glass-card p-8 text-center">
            <p class="text-[9px] uppercase text-slate-500 mb-3 tracking-widest">
                Códigos Únicos
            </p>

            <h3 class="text-5xl font-bold text-white">
                {{ unique_types }}
            </h3>
        </div>

        <!-- Card 4 -->
        <div class="glass-card p-8 text-center border-white/5">
            <p class="text-[9px] uppercase text-slate-500 mb-3 tracking-widest">
                Instancia
            </p>

            <h3 class="text-xl font-semibold mt-3 text-white">
                {{ db_name }}
            </h3>
        </div>

    </div>

</div>

<script>
function ejecutarAuditoria() {
    console.log("🚀 Iniciando comunicación con el Backend...");
    
    const btn = document.getElementById('btn-audit');
    // Buscamos el texto dentro del botón para cambiarlo
    const btnText = btn.querySelector('span'); 
    
    // Feedback visual inmediato
    btn.disabled = true;
    btn.style.opacity = "0.5";
    btnText.innerText = "ESCANEANDO...";

    fetch('/run-audit', { method: 'POST' })
        .then(response => {
            console.log("📡 Respuesta recibida del servidor");
            return response.json();
        })
        .then(data => {
            if (data.status === 'success') {
                console.log("✅ Auditoría exitosa ID:", data.snapshot_id);
                window.location.reload(); // Recargamos para ver los nuevos números
            } else {
                alert("Error: " + data.message);
                btn.disabled = false;
                btn.style.opacity = "1";
                btnText.innerText = "ESCANEAR BASE DE DATOS";
            }
        })
        .catch(err => {
            console.error("❌ Error en la conexión:", err);
            btn.disabled = false;
            btn.style.opacity = "1";
            btnText.innerText = "ESCANEAR BASE DE DATOS";
        });
}
</script>
{% endblock %}
